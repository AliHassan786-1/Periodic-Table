
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colorful Periodic Table</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Periodic Table of Elements</h1>

  <div class="periodic-table">
    <div class="element nonmetal" style="--col:1;--row:1" data-number="1" data-name="Hydrogen">H</div>
    <div class="element noble" style="--col:18;--row:1" data-number="2" data-name="Helium">He</div>

    <div class="element metal" style="--col:1;--row:2" data-number="3" data-name="Lithium">Li</div>
    <div class="element metal" style="--col:2;--row:2" data-number="4" data-name="Beryllium">Be</div>
    <div class="element metalloid" style="--col:13;--row:2" data-number="5" data-name="Boron">B</div>
    <div class="element nonmetal" style="--col:14;--row:2" data-number="6" data-name="Carbon">C</div>
    <div class="element nonmetal" style="--col:15;--row:2" data-number="7" data-name="Nitrogen">N</div>
    <div class="element nonmetal" style="--col:16;--row:2" data-number="8" data-name="Oxygen">O</div>
    <div class="element nonmetal" style="--col:17;--row:2" data-number="9" data-name="Fluorine">F</div>
    <div class="element noble" style="--col:18;--row:2" data-number="10" data-name="Neon">Ne</div>

    <div class="element metal" style="--col:1;--row:3" data-number="11" data-name="Sodium">Na</div>
    <div class="element metal" style="--col:2;--row:3" data-number="12" data-name="Magnesium">Mg</div>
    <div class="element metal" style="--col:13;--row:3" data-number="13" data-name="Aluminium">Al</div>
    <div class="element metalloid" style="--col:14;--row:3" data-number="14" data-name="Silicon">Si</div>
    <div class="element nonmetal" style="--col:15;--row:3" data-number="15" data-name="Phosphorus">P</div>
    <div class="element nonmetal" style="--col:16;--row:3" data-number="16" data-name="Sulfur">S</div>
    <div class="element nonmetal" style="--col:17;--row:3" data-number="17" data-name="Chlorine">Cl</div>
    <div class="element noble" style="--col:18;--row:3" data-number="18" data-name="Argon">Ar</div>

    <div class="element metal" style="--col:1;--row:4" data-number="19" data-name="Potassium">K</div>
    <div class="element metal" style="--col:2;--row:4" data-number="20" data-name="Calcium">Ca</div>
    <div class="element metal" style="--col:3;--row:4" data-number="21" data-name="Scandium">Sc</div>
    <div class="element metal" style="--col:4;--row:4" data-number="22" data-name="Titanium">Ti</div>
    <div class="element metal" style="--col:5;--row:4" data-number="23" data-name="Vanadium">V</div>
    <div class="element metal" style="--col:6;--row:4" data-number="24" data-name="Chromium">Cr</div>
    <div class="element metal" style="--col:7;--row:4" data-number="25" data-name="Manganese">Mn</div>
    <div class="element metal" style="--col:8;--row:4" data-number="26" data-name="Iron">Fe</div>
    <div class="element metal" style="--col:9;--row:4" data-number="27" data-name="Cobalt">Co</div>
    <div class="element metal" style="--col:10;--row:4" data-number="28" data-name="Nickel">Ni</div>
    <div class="element metal" style="--col:11;--row:4" data-number="29" data-name="Copper">Cu</div>
    <div class="element metal" style="--col:12;--row:4" data-number="30" data-name="Zinc">Zn</div>
    <div class="element metal" style="--col:13;--row:4" data-number="31" data-name="Gallium">Ga</div>
    <div class="element metalloid" style="--col:14;--row:4" data-number="32" data-name="Germanium">Ge</div>
    <div class="element metalloid" style="--col:15;--row:4" data-number="33" data-name="Arsenic">As</div>
    <div class="element nonmetal" style="--col:16;--row:4" data-number="34" data-name="Selenium">Se</div>
    <div class="element nonmetal" style="--col:17;--row:4" data-number="35" data-name="Bromine">Br</div>
    <div class="element noble" style="--col:18;--row:4" data-number="36" data-name="Krypton">Kr</div>
  </div>

  <p class="note">Hover over an element to see its name.</p>

</body>
</html>
